# Default profile (`docker compose up`): the paper trading bot only.
# Postgres/Redis/Grafana are NOT consumed by any code yet — they live behind
# the "full" profile until real persistence/metrics backends are wired in,
# so the default stack runs only what is real (P0 honesty rule).
#
#   docker compose up                          # paper bot only
#   docker compose --profile full up           # + postgres/redis/grafana
#   docker compose run --rm test               # full test suite

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pyrobot-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - PYROBOT_SYMBOLS=${PYROBOT_SYMBOLS:-MSFT,AAPL}
      - PYROBOT_BARS=${PYROBOT_BARS:-2000}
      - PYROBOT_MODE=${PYROBOT_MODE:-paper}
      - PYROBOT_BALANCE=${PYROBOT_BALANCE:-100000}
      - PYROBOT_BAR_INTERVAL=${PYROBOT_BAR_INTERVAL:-1.0}
      - PYROBOT_AUDIT_PATH=/app/data/audit/ledger.jsonl
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp:size=100M

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: pyrobot-test
    profiles: ["test"]
    networks:
      - trading-net

  postgres:
    image: postgres:16.3-alpine
    container_name: pyrobot-postgres
    restart: unless-stopped
    profiles: ["full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: pyrobot-redis
    restart: unless-stopped
    profiles: ["full"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pyrobot-grafana
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_in_production}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - trading-net

volumes:
  bot-data:
  bot-logs:
  pg-data:
  redis-data:
  grafana-data:

networks:
  trading-net:
    driver: bridge
