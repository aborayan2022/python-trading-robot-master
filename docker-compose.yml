services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pyrobot-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp:size=100M

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: pyrobot-test
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    networks:
      - trading-net

  postgres:
    image: postgres:16.3-alpine
    container_name: pyrobot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: pyrobot-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pyrobot-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_in_production}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - trading-net

volumes:
  bot-data:
  bot-logs:
  pg-data:
  redis-data:
  grafana-data:

networks:
  trading-net:
    driver: bridge
