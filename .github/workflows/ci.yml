name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  core-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run core tests without console extras
        run: |
          pytest tests/ -v

  multi-market-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. ml extras for strat tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Every backtest must run cleanly in --dry-run (cache-only, no network).
      - name: Backtest dry-runs for all markets
        run: |
          for bt in backtest_us_mean_reversion.py backtest_us_breakout.py \
                    backtest_metals_trend.py backtest_metals_momentum.py \
                    backtest_crypto_trend.py backtest_crypto_mean_rev.py; do
            echo "::group::$bt"
            python "$bt" --dry-run || exit 1
            echo "::endgroup::"
          done

      # Every paper session must pass a smoke check (cached data + wiring).
      - name: Paper session smokes (metals + crypto)
        run: |
          python metals_paper_session.py --smoke || exit 1
          python crypto_paper_session.py --smoke || exit 1

      - name: Run full test suite
        run: |
          pytest tests/ -v

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check pyrobot/

      - name: Type check with mypy (enforced packages)
        run: |
          mypy pyrobot/ai/ pyrobot/backtesting/ pyrobot/runtime/ pyrobot/risk/ pyrobot/execution/ pyrobot/audit/ --ignore-missing-imports --follow-imports=silent

      # Legacy modules (robot.py, trades.py, portfolio.py, indicators.py,
      # stock_frame.py, broker SDK adapters) carry ~130 pre-existing mypy
      # errors from before this roadmap. Full-tree strictness returns when
      # that debt is paid; this step reports it without blocking.
      - name: Type check with mypy (full tree, non-blocking report)
        run: |
          mypy pyrobot/ --ignore-missing-imports || echo "::warning::legacy mypy debt remains (see IMPLEMENTATION_STATUS.md)"
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=pyrobot --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
