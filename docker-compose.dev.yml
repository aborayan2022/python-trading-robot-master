services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pyrobot-bot-dev
    env_file: .env
    environment:
      - LOG_LEVEL=DEBUG
      - PYROBOT_MODE=paper
    volumes:
      - ./pyrobot:/app/pyrobot
      - ./tests:/app/tests
      - bot-data:/app/data
    ports:
      - "8080:8080"
    networks:
      - trading-net
    read_only: false
    tmpfs:
      - /tmp:size=100M
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    command: >
      python -m pytest tests/ -v --tb=short -x

volumes:
  bot-data:

networks:
  trading-net:
    driver: bridge
